<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>TOP画像管理 | AN:RIEL ADMIN</title>
<link href="../../css/admin.css" rel="stylesheet"/>
<style>

    /* ==================================================

       TOP SLIDE

       NEWS管理のデザインをベースにした

       TOP画像専用部分のみ

    ================================================== */

    .top-admin-view {

      display: none;

    }

    .top-admin-view.active {

      display: block;

    }

    /* ==================================================

       LIST

    ================================================== */

    .top-slide-list {

      display: flex;

      flex-direction: column;

      gap: 0;

    }

    .top-slide-card {

      display: grid;

      grid-template-columns:

        220px

        minmax(0, 1fr)

        auto;

      gap: 22px;

      align-items: center;

      padding: 20px 0;

      border-bottom: 1px solid #ececef;

    }

    .top-slide-card:last-child {

      border-bottom: none;

    }

    /* IMAGE */

    .top-slide-thumbnail {

      width: 220px;

      aspect-ratio: 16 / 9;

      overflow: hidden;

      background: #f2f2f3;

      border: 1px solid #e4e5e8;

      border-radius: 8px;

    }

    .top-slide-thumbnail img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    /* INFO */

    .top-slide-info {

      min-width: 0;

    }

    .top-slide-order {

      margin: 0 0 7px;

      color: #222;

      font-size: 14px;

      font-weight: 700;

    }

    .top-slide-link {

      margin: 0 0 9px;

      color: #777;

      font-size: 12px;

      line-height: 1.7;

      overflow-wrap: anywhere;

    }

    .top-slide-status {

      display: inline-flex;

      align-items: center;

      min-height: 25px;

      padding: 3px 9px;

      color: #666;

      font-size: 11px;

      font-weight: 700;

      background: #f4f4f5;

      border: 1px solid #e3e3e5;

      border-radius: 999px;

    }

    .top-slide-status.published {

      color: #111;

      background: #fff;

    }

    /* ACTION */

    .top-slide-actions {

      display: flex;

      gap: 8px;

      align-items: center;

    }

    /* ==================================================

       DROP ZONE

    ================================================== */

    .top-image-drop-zone {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 180px;

      padding: 28px;

      text-align: center;

      cursor: pointer;

      background: #fafafa;

      border: 1px dashed #cfd0d4;

      border-radius: 8px;

      transition:

        background 0.2s ease,

        border-color 0.2s ease;

    }

    .top-image-drop-zone:hover,

    .top-image-drop-zone.dragover {

      background: #f5f5f6;

      border-color: #999;

    }

    .top-image-drop-title {

      margin: 0 0 6px;

      color: #222;

      font-size: 14px;

      font-weight: 700;

    }

    .top-image-drop-sub {

      margin: 0 0 5px;

      color: #777;

      font-size: 12px;

    }

    .top-image-drop-limit {

      margin: 0;

      color: #999;

      font-size: 11px;

    }

    /* ==================================================

       PREVIEW

    ================================================== */

    .top-image-preview {

      display: none;

      margin-top: 18px;

    }

    .top-image-preview.active {

      display: block;

    }

    .top-image-preview img {

      display: block;

      width: min(100%, 640px);

      height: auto;

      aspect-ratio: 16 / 9;

      object-fit: cover;

      background: #f2f2f3;

      border: 1px solid #e4e5e8;

      border-radius: 8px;

    }

    /* ==================================================

       RESPONSIVE

    ================================================== */

    @media (max-width: 800px) {

      .top-slide-card {

        grid-template-columns: 150px minmax(0, 1fr);

        gap: 16px;

      }

      .top-slide-thumbnail {

        width: 150px;

      }

      .top-slide-actions {

        grid-column: 1 / -1;

        justify-content: flex-end;

      }

    }

    @media (max-width: 520px) {

      .top-slide-card {

        grid-template-columns: 1fr;

      }

      .top-slide-thumbnail {

        width: 100%;

      }

      .top-slide-actions {

        grid-column: auto;

        justify-content: flex-start;

      }

      .top-image-drop-zone {

        min-height: 150px;

        padding: 22px 16px;

      }

    }

  </style>
</head>
<body class="admin-page" data-admin-feature="top">
<!-- ==================================================

       HEADER

  ================================================== -->
<header class="admin-header">
<div class="admin-header-inner">
<div class="admin-header-logo">
<img alt="AN:RIEL" src="../../images/logo.png"/>
</div>
<div class="admin-header-right">
<a class="admin-site-button" href="https://anriel-official.github.io/ANRIEL-Official-Website/top.html" target="_blank" rel="noopener noreferrer">公式サイト ↗</a>

<span class="admin-header-label">

          ADMIN

        </span>
<button class="logout-button" id="logoutButton" type="button">

          LOGOUT

        </button>
</div>
</div>
</header>
<!-- ==================================================

       MAIN

  ================================================== -->
<main class="admin-main">
<div class="admin-container">
<!-- ==================================================

           TITLE

      ================================================== -->
<div class="admin-title-area">
<h1>

          TOP画像管理

        </h1>
</div>
<!-- ==================================================

           ADMIN MENU

      ================================================== -->
<nav aria-label="管理メニュー" class="admin-tabs">
<a class="admin-tab" href="../index.html">

          管理TOP

        </a>
<a aria-current="page" class="admin-tab active" href="./index.html">

          TOP画像管理

        </a>
<a class="admin-tab" href="../news/index.html">

          NEWS管理

        </a>
<a class="admin-tab" href="../schedule/index.html">

          SCHEDULE管理

        </a>
<a class="admin-tab" href="../goods/index.html">

          GOODS管理

        </a>
<a class="admin-tab" href="../talent/index.html">TALENT管理</a>
</nav>
<!-- ==================================================

           TOP PANEL

      ================================================== -->
<section class="admin-panel active" id="topPanel">
<!-- ==================================================

             PANEL HEADING

        ================================================== -->
<div class="panel-heading">
<div>
<h2>

              TOP画像管理

            </h2>
<p class="panel-description">

              公式サイトTOPに表示する画像の追加・編集

            </p>
</div>
</div>
<!-- ==================================================

             NAVIGATION

             NEWS管理と同じデザイン

        ================================================== -->
<div class="news-admin-navigation">
<button class="news-admin-nav-button active" data-top-view="list" id="topListTabButton" type="button">

            画像一覧

          </button>
<button class="news-admin-nav-button" data-top-view="form" id="topNewTabButton" type="button">

            画像追加

          </button>
</div>
<!-- ==================================================

             LIST VIEW

        ================================================== -->
<div class="top-admin-view active" id="topListView">
<div class="news-view-heading">
<div>
<h3>

                TOP画像一覧

              </h3>
<p class="news-view-description">

                登録済みTOP画像の編集・削除

              </p>
</div>
<button class="admin-secondary-button" id="reloadTopSlidesButton" type="button">

              再読み込み

            </button>
</div>
<div class="admin-list-card">
<div class="list-heading">
<div>
<h3>

                  登録画像

                </h3>
<p class="list-count" id="topSlideListCount">

                  読み込み中...

                </p>
</div>
</div>
<div class="top-slide-list" id="topSlideList">
<p class="loading-text">

                読み込み中...

              </p>
</div>
</div>
</div>
<!-- ==================================================

             NEW / EDIT VIEW

        ================================================== -->
<div class="top-admin-view" id="topFormView">
<div class="editor-card" id="topSlideFormArea">
<div class="editor-heading">
<h3 id="topSlideFormTitle">

                TOP画像を追加

              </h3>
<button aria-label="閉じる" class="close-editor-button" id="topSlideCancelButton" type="button">

                ×

              </button>
</div>
<form id="topSlideForm">
<!-- ID -->
<input id="topSlideId" type="hidden"/>
<!-- CURRENT IMAGE -->
<input id="currentTopSlideImageUrl" type="hidden"/>
<!-- ==================================================

                   IMAGE

              ================================================== -->
<div class="form-group">
<label>

                  TOP画像

                </label>
<div class="top-image-drop-zone" id="topImageDropArea" role="button" tabindex="0">
<p class="top-image-drop-title">

                    画像をドラッグ＆ドロップ

                  </p>
<p class="top-image-drop-sub">

                    またはクリックして画像を選択

                  </p>
<p class="top-image-drop-limit">

                    JPEG / PNG / WebP / GIF・1枚5MBまで

                  </p>
</div>
<input accept="image/jpeg,image/png,image/webp,image/gif" hidden="" id="topSlideImage" type="file"/>
<p class="form-message" id="topImageMessage"></p>
<div class="top-image-preview" id="topImagePreview">
<img alt="TOP画像プレビュー" id="topImagePreviewImage" src=""/>
</div>
</div>
<!-- ==================================================

                   LINK

              ================================================== -->
<div class="form-group">
<label for="topSlideLinkUrl">

                  リンクURL

                </label>
<input id="topSlideLinkUrl" placeholder="https://example.com/" type="url"/>
<p class="form-help">

                  画像をクリックしたときのリンク先。リンク不要の場合は空欄。

                </p>
</div>
<!-- ==================================================

                   ORDER + PUBLISHED

              ================================================== -->
<div class="form-row">
<input id="topSlideSortOrder" type="hidden" value="0"/>
<div class="form-group checkbox-group">
<label class="form-label">

                    公開設定

                  </label>
<label class="checkbox-label">
<input checked="" id="topSlidePublished" type="checkbox"/>
<span>

                      公開する

                    </span>
</label>
</div>
</div>
<!-- ==================================================

                   MESSAGE

              ================================================== -->
<p class="form-message" id="topSlideFormMessage"></p>
<!-- ==================================================

                   ACTIONS

              ================================================== -->
<div class="editor-actions">
<button class="admin-primary-button" type="submit">

                  保存

                </button>
<button class="admin-secondary-button" id="topSlideCancelButtonBottom" type="button">

                  キャンセル

                </button>
</div>
</form>
</div>
</div>
</section>
</div>
</main>
<!-- ==================================================

       SCRIPTS

  ================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<script src="../js/admin-navigation.js"></script>
<script src="../js/image-optimizer.js"></script>
<script src="../js/top-admin.js"></script>
<!-- ==================================================

       TOP PAGE CONTROL

  ================================================== -->
<script>

    const topListTabButton =

      document.getElementById(

        "topListTabButton"

      );

    const topNewTabButton =

      document.getElementById(

        "topNewTabButton"

      );

    const topListView =

      document.getElementById(

        "topListView"

      );

    const topFormView =

      document.getElementById(

        "topFormView"

      );

    // ==================================================

    // SWITCH VIEW

    // ==================================================

    async function switchTopView(

      view,

      options = {}

    ) {

      const {

        resetForm = true,

        updateUrl = true

      } = options;

      topListView

        ?.classList.remove(

          "active"

        );

      topFormView

        ?.classList.remove(

          "active"

        );

      topListTabButton

        ?.classList.remove(

          "active"

        );

      topNewTabButton

        ?.classList.remove(

          "active"

        );

      // ------------------------------------------

      // FORM

      // ------------------------------------------

      if (view === "form") {

        topFormView

          ?.classList.add(

            "active"

          );

        topNewTabButton

          ?.classList.add(

            "active"

          );

        if (

          resetForm &&

          typeof window.resetTopSlideForm ===

            "function"

        ) {

          window.resetTopSlideForm();

        }

        if (updateUrl) {

          history.replaceState(

            null,

            "",

            "?view=form"

          );

        }

        return;

      }

      // ------------------------------------------

      // LIST

      // ------------------------------------------

      topListView

        ?.classList.add(

          "active"

        );

      topListTabButton

        ?.classList.add(

          "active"

        );

      if (

        typeof window.loadTopSlides ===

          "function"

      ) {

        await window.loadTopSlides();

      }

      if (updateUrl) {

        history.replaceState(

          null,

          "",

          "?view=list"

        );

      }

    }

    window.switchTopView =

      switchTopView;

    // ==================================================

    // TAB EVENTS

    // ==================================================

    topListTabButton

      ?.addEventListener(

        "click",

        async () => {

          await switchTopView(

            "list"

          );

        }

      );

    topNewTabButton

      ?.addEventListener(

        "click",

        async () => {

          await switchTopView(

            "form"

          );

        }

      );

    // ==================================================

    // AUTH + INITIAL VIEW

    // ==================================================

    document.addEventListener(

      "DOMContentLoaded",

      async () => {

        try {

          const {

            data,

            error

          } =

            await supabaseClient

              .auth

              .getSession();

          if (error) {

            console.error(

              "セッション確認エラー:",

              error

            );

            return;

          }

          if (!data.session) {

            window.location.replace(

              "../login.html"

            );

            return;

          }

          // ------------------------------------------

          // URL

          // ------------------------------------------

          const params =

            new URLSearchParams(

              window.location.search

            );

          let initialView =

            params.get(

              "view"

            );

          const initialAction =

            params.get(

              "action"

            );

          if (

            initialAction === "new"

          ) {

            initialView =

              "form";

          }

          if (

            ![

              "list",

              "form"

            ].includes(

              initialView

            )

          ) {

            initialView =

              "list";

          }

          await switchTopView(

            initialView,

            {

              resetForm: true,

              updateUrl: false

            }

          );

        } catch (error) {

          console.error(

            "TOP画像管理画面初期化エラー:",

            error

          );

        }

        // ------------------------------------------

        // LOGOUT

        // ------------------------------------------

        const logoutButton =

          document.getElementById(

            "logoutButton"

          );

        logoutButton

          ?.addEventListener(

            "click",

            async () => {

              try {

                const {

                  error

                } =

                  await supabaseClient

                    .auth

                    .signOut();

                if (error) {

                  console.error(

                    "ログアウトエラー:",

                    error

                  );

                  alert(

                    "ログアウトに失敗しました。"

                  );

                  return;

                }

                window.location.replace(

                  "../login.html"

                );

              } catch (error) {

                console.error(

                  "ログアウトエラー:",

                  error

                );

                alert(

                  "ログアウトに失敗しました。"

                );

              }

            }

          );

      }

    );

  </script>
</body>
</html>
